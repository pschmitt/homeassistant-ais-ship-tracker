refresh_vessel_photo:
  name: Refresh vessel photo
  description: >-
    Force a fresh photo lookup for targeted vessel sensors, one MMSI, or all
    currently known vessels when no target or MMSI is provided.
  target:
    entity:
      integration: ais_vessel_tracker
      domain: sensor
  fields:
    mmsi:
      name: MMSI
      description: Leave empty to use the target or refresh all known vessels.
      example: "211890880"
      selector:
        text:
    ignore_cache:
      name: Ignore cache
      description: >-
        Delete any cached photo for the target vessel(s) first, then look up
        a new one instead of reusing the cached result. Without a target or
        MMSI, this clears the entire photo cache for all configured areas.
      default: false
      selector:
        boolean:

purge_vessel_photos:
  name: Purge vessel photos
  description: >-
    Delete every cached vessel photo for all configured areas without
    looking up new ones. Photos are re-fetched the next time a vessel
    becomes an area's last-passing-vessel or a new map entity is created.
